name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run build

      - name: Inspect release artifacts
        shell: pwsh
        run: Get-ChildItem release | Format-Table -AutoSize

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: YOWLMAFFIA ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/YOWLMAFFIA.exe
            release/latest.yml
            release/YOWLMAFFIA.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync release to Supabase
        if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PAGE: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $headers = @{
            apikey = $env:SUPABASE_SERVICE_ROLE_KEY
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
            'Content-Type' = 'application/json'
            Prefer = 'resolution=merge-duplicates,return=representation'
          }

          $body = @{
            version = $version
            download_url = $env:RELEASE_PAGE
            notes = 'Nieuwe YOWLMAFFIA-release via GitHub Releases.'
            is_required = $false
            published_at = (Get-Date).ToString('o')
          } | ConvertTo-Json -Depth 4

          Invoke-RestMethod -Method Post -Uri "$($env:SUPABASE_URL)/rest/v1/app_update_releases?on_conflict=version" -Headers $headers -Body $body | Out-Null
